keys:
  - &admin 
  - &desktop_system 
  - &desktop_user 
  - &desktop_svc 
creation_rules:
  # Desktop secrets
  - path_regex: secrets/desktop/system\.yaml$
    key_groups:
      - age: [*admin, *desktop_system]
  - path_regex: secrets/desktop/user\.yaml$
    key_groups:
      - age: [*admin, *desktop_user]
  - path_regex: secrets/desktop/svc\.yaml$
    key_groups:
      - age: [*admin, *desktop_svc]
